<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turkish Home - POS System</title>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      document.body.innerHTML += `<div style="color:red; background:white; padding:20px; border:2px solid red; margin:20px; font-family:monospace; direction:ltr; text-align:left;">
          <h3>Global Error:</h3>
          <p>${message}</p>
          <p>Source: ${source}:${lineno}:${colno}</p>
          <pre>${error ? error.stack : 'No stack trace'}</pre>
        </div>`;
    };

    window.onunhandledrejection = function (event) {
      document.body.innerHTML += `<div style="color:red; background:white; padding:20px; border:2px solid red; margin:20px; font-family:monospace; direction:ltr; text-align:left;">
          <h3>Unhandled Rejection:</h3>
          <p>${event.reason}</p>
        </div>`;
    };
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
